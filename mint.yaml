version: 1
name: FlightAware
slug: flightaware
summary: >-
  Live flight tracking and aviation data via FlightAware AeroAPI — flights,
  airports, operators, schedules, and alerts
examples:
  - prompt: >-
      Where is United flight UA123 right now, and is it running on time?
    note: Looks up recent and current flights for the ident, then its live position
  - prompt: >-
      Are there any delays at Chicago O'Hare right now, and what's the current
      weather there?
    note: Combines the airport delay feed with METAR observations
  - prompt: >-
      Show me the next few scheduled departures from SFO
    note: Reads the airport's flight board
env:
  - name: AEROAPI_API_KEY
    secret: true
    required: true
    help: >-
      Your FlightAware AeroAPI key (https://www.flightaware.com/aeroapi/portal/)
  - name: AEROAPI_OUTPUT_DIR
    required: false
    help: >-
      Default directory for flight-map PNGs (default: current working directory)
  - name: AEROAPI_CACHE_TTL
    required: false
    help: >-
      Seconds to cache identical live-data GET responses (default 15; 0
      disables)
  - name: AEROAPI_STATIC_CACHE_TTL
    required: false
    help: >-
      Seconds to cache reference data — airports, operators, routes, ownership
      (default 3600; 0 disables)
egress:
  allow:
    # Only hosts the SERVER process actually fetches.
    - aeroapi.flightaware.com
    - www.flightaware.com
